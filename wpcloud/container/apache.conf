# wp-cloud Apache variant — real .htaccess handling for plugins that require it
ServerTokens Prod
DirectoryIndex index.php index.html
<Directory "/srv/site">
    AllowOverride All
    Require all granted
</Directory>
# front controller for WP permalinks when .htaccess absent
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.php [L]
</IfModule>
